<script>
/* ==========================================================
   資料定義：分類 → 函數 的兩層結構
   ========================================================== */
const categories = [
  { key:'agg',  label:'加總與計算' },
  { key:'cond', label:'條件判斷' },
  { key:'search', label:'查詢與參照' },
  { key:'text', label:'字串處理' },
  { key:'date', label:'日期與時間' },
  { key:'round', label:'數字進位與格式' }
];

const functions = {

  /* ---------------- 加總與計算 ---------------- */
  sum: {
    cat:'agg', label:'加總 (SUM)', level:'初級',
    scene:'適用情境：加總請款單上的各項費用、計算每日營業額的月度總計',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，顯示把
      <span contenteditable class="blank" data-k="from">${v.from}</span> 儲存格到
      <span contenteditable class="blank" data-k="to">${v.to}</span> 儲存格之間所有數字加總後的結果。`,
    values: {target:'A1', from:'B1', to:'D1'},
    formula: (v) => `=SUM(${v.from}:${v.to})`,
    explain: (v) => `<b>SUM函數</b>會把指定範圍內儲存格的數值全部加總。<br>
      <b>SUM(${v.from}:${v.to})</b> 代表「從${v.from}儲存格加總到${v.to}儲存格」的意思。請把結果填入${v.target}儲存格。`,
    pitfall: `如果在費用明細表最下方新增了一列費用項目，但加總欄位的公式仍固定為像<b>SUM(B1:B10)</b>這樣的範圍，新增列的金額就不會被計入總計。如果是在範圍內側（最後一列的上方）插入新列，公式會自動延伸；但如果是在範圍外側（最後一列下方）新增列，就必須手動調整加總公式的範圍。如果要加總不連續的儲存格，也可以用逗號分隔，例如<b>SUM(B1,D1,F1)</b>。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  average: {
    cat:'agg', label:'平均值 (AVERAGE)', level:'初級',
    scene:'適用情境：計算教育訓練測驗的平均分數、各部門的平均加班時數',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，顯示
      <span contenteditable class="blank" data-k="from">${v.from}</span> 儲存格到
      <span contenteditable class="blank" data-k="to">${v.to}</span> 儲存格之間數字的平均值。`,
    values: {target:'E1', from:'B1', to:'D1'},
    formula: (v) => `=AVERAGE(${v.from}:${v.to})`,
    explain: (v) => `<b>AVERAGE函數</b>會計算指定範圍內數值的平均值（總和 ÷ 個數）。`,
    pitfall: `如果10位受測者中有1人缺席，卻在缺席者的分數欄填入「0分」，AVERAGE函數會把這個0也算進去，導致本來應該是9人份的平均分數被當成10人份來計算，使平均分數比實際情況低很多。空白儲存格會自動被排除在平均值計算之外，所以缺席者的欄位應該保持空白，而不是填入0。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  count: {
    cat:'agg', label:'個數統計 (COUNT/COUNTA)', level:'初級',
    scene:'適用情境：計算請款單已提交的件數、已蓋章申請書的件數',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，計算從
      <span contenteditable class="blank" data-k="from">${v.from}</span> 到
      <span contenteditable class="blank" data-k="to">${v.to}</span> 的範圍內，
      <select class="blank-select" data-k="mode" style="width:140px;">
        <option value="有數字的" ${v.mode==='有數字的'?'selected':''}>有數字的</option>
        <option value="包含文字的全部" ${v.mode==='包含文字的全部'?'selected':''}>包含文字的全部</option>
      </select>
      儲存格數量。`,
    values: {target:'F1', from:'B1', to:'B10', mode:'有數字的'},
    formula: (v) => v.mode.includes('數字') ? `=COUNT(${v.from}:${v.to})` : `=COUNTA(${v.from}:${v.to})`,
    explain: (v) => `<b>COUNT函數</b>只計算含有數字的儲存格，<b>COUNTA函數</b>則會計算包含文字在內、只要有輸入內容的儲存格。系統會依照你選擇的內容自動判斷要使用哪一個。`,
    pitfall: `如果在已提交的申請書清單中，只在對應欄位輸入「已核可」之類的文字，使用COUNT函數計算件數時，因為文字不會被當作數字，結果會顯示為0件。如果也想計算輸入了文字的儲存格，就需要使用COUNTA函數。只算數字用COUNT，連文字也算就用COUNTA，這樣記就不會搞混。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  sumif: {
    cat:'agg', label:'條件式加總 (SUMIF)', level:'中級',
    scene:'適用情境：計算各部門的費用加總、各業務負責人的業績加總',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，把
      <span contenteditable class="blank" data-k="condRange">${v.condRange}</span> 範圍內符合
      「<span contenteditable class="blank" data-k="cond" style="width:70px;">${v.cond}</span>」的資料列，加總其對應的
      <span contenteditable class="blank" data-k="sumRange">${v.sumRange}</span> 數字。`,
    values: {target:'E1', condRange:'B1:B10', cond:'業務部', sumRange:'C1:C10'},
    formula: (v) => `=SUMIF(${v.condRange},"${v.cond}",${v.sumRange})`,
    explain: (v) => `<b>SUMIF函數</b>只會加總符合條件的資料列。「用來判斷條件的欄位（${v.condRange}）」和「要加總的欄位（${v.sumRange}）」的列數必須對齊。`,
    pitfall: `如果部門名稱欄位是B2:B10，卻不小心把加總對象的金額欄位指定成錯開一列的C1:C9，就會導致部門名稱與金額的對應關係整整錯開一列，算出來的部門別加總金額也會跟實際情況不同。表格開頭是否有標題列很容易造成起始列的誤差，請務必確認條件範圍和加總範圍的列數、起始列是否一致。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  subtotal: {
    cat:'agg', label:'篩選後加總 (SUBTOTAL)', level:'高級',
    scene:'適用情境：篩選資料後，仍想正確顯示加總結果',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，即使套用篩選，也能正確加總
      <span contenteditable class="blank" data-k="from">${v.from}</span> 到
      <span contenteditable class="blank" data-k="to">${v.to}</span> 儲存格的數字。`,
    values: {target:'D1', from:'B2', to:'B20'},
    formula: (v) => `=SUBTOTAL(109,${v.from}:${v.to})`,
    explain: (v) => `<b>SUBTOTAL函數</b>可以在計算時排除被篩選隱藏的資料列。「109」代表計算方法為加總。`,

  rank: {

    explain: (v) => `<b>RANK函數</b>會計算指定儲存格的數值，在某個範圍中排第幾名。第3個引數「0」代表由大到小（降冪）排序，「1」代表由小到大（升冪）排序，系統會依照你的選擇自動切換。`,
    pitfall: `如果把10位業務人員成績排名的公式從B1直接往下複製，範圍的指定（B1:B10）會跟著每列往下移動一列，導致第2位以後的排名都是在人數逐漸減少的範圍中計算出來的，顯示的名次會和實際成績不符。要把這個公式複製到其他列時，範圍的部分必須改成<b>絕對參照</b>（加上$符號，例如$B$1:$B$10）。`,

  largesmall: {

  /* ---------------- 條件判斷 ---------------- */
  if: {
    cat:'cond', label:'依條件切換顯示內容 (IF)', level:'初級',
    scene:'適用情境：判定及格／不及格、依金額分別處理',
    render: (v) => `我想設定：如果 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格的數字
      <select class="blank-select" data-k="cmp" style="width:110px;">
        <option value="大於" ${v.cmp==='大於'?'selected':''}>大於</option>
        <option value="大於或等於" ${v.cmp==='大於或等於'?'selected':''}>大於或等於</option>
        <option value="小於" ${v.cmp==='小於'?'selected':''}>小於</option>
        <option value="小於或等於" ${v.cmp==='小於或等於'?'selected':''}>小於或等於</option>
        <option value="等於" ${v.cmp==='等於'?'selected':''}>等於</option>
      </select>
      <span contenteditable class="blank" data-k="threshold">${v.threshold}</span>，就顯示
      「<span contenteditable class="blank" data-k="yes" style="width:70px;">${v.yes}</span>」，
      否則顯示
      「<span contenteditable class="blank" data-k="no" style="width:70px;">${v.no}</span>」。`,
    values: {target:'C1', threshold:'80', cmp:'大於', yes:'合格', no:'不合格'},
    formula: (v) => {
      const opMap = {'大於':'>','大於或等於':'>=','小於':'<','小於或等於':'<=','等於':'='};
      const op = opMap[v.cmp] || '>';
      return `=IF(${v.target}${op}${v.threshold},"${v.yes}","${v.no}")`;
    },
    explain: (v) => `<b>IF函數</b>會在「條件成立時顯示A，不成立時顯示B」。依照你選擇的比較方式（大於／大於或等於／小於／小於或等於／等於），對應的符號（&gt; &gt;= &lt; &lt;= =）會自動代入。`,
    pitfall: `如果及格門檻訂在剛好80分，卻誤選了「大於」（不含80分本身）而不是「大於或等於」，剛好80分的人就會被判定為不及格。混淆「大於或等於」和「大於」會改變邊界數字（此例中就是剛好80分）的判定結果，請事先確認基準數字本身是否要納入。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  ifs: {
    cat:'cond', label:'三段以上等級分類 (IFS)', level:'中級',
    scene:'適用情境：A/B/C評等等，三個以上等級的分類',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中：數字在
      <span contenteditable class="blank" data-k="t1">${v.t1}</span> 以上顯示「<span contenteditable class="blank" data-k="r1" style="width:50px;">${v.r1}</span>」，
      <span contenteditable class="blank" data-k="t2">${v.t2}</span> 以上顯示「<span contenteditable class="blank" data-k="r2" style="width:50px;">${v.r2}</span>」，
      其餘則顯示「<span contenteditable class="blank" data-k="r3" style="width:50px;">${v.r3}</span>」。`,
    values: {target:'C1', t1:'80', r1:'A', t2:'60', r2:'B', r3:'C'},
    formula: (v) => `=IFS(${v.target}>=${v.t1},"${v.r1}",${v.target}>=${v.t2},"${v.r2}",TRUE,"${v.r3}")`,
    explain: (v) => `<b>IFS函數</b>會依序由上而下判斷條件，並傳回第一個符合的結果。最後的「其餘」則是用<b>TRUE</b>當作條件，代表「都不符合上述情況時」的處理方式。`,
    pitfall: `如果把IF函數多層嵌套的公式弄得又長又難懂，改用IFS會清爽許多。不過如果這份檔案要交給客戶等對象，而對方用<b>Excel 2016以前</b>的版本開啟，函數名稱可能無法被辨識而出現<b>#NAME?</b>錯誤，請留意對方使用的Excel版本。`,
    version: `需要Excel 2019或Microsoft 365（Excel 2016以前的版本無法使用）。`
  },
  iferror: {
    cat:'cond', label:'避免出現錯誤 (IFERROR)', level:'中級',
    scene:'適用情境：想避免除法等計算出現錯誤導致表格跑版',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，如果公式

    values: {target:'D1', formula:'B1/C1', fallback:'0'},
    formula: (v) => `=IFERROR(${v.formula},${isNaN(v.fallback) ? `"${v.fallback}"` : v.fallback})`,
    explain: (v) => `<b>IFERROR函數</b>就像是直接套在既有公式外面的「保險」。沒有發生錯誤時會照常顯示計算結果，一旦發生錯誤，就會切換成你指定的顯示內容。`,
    pitfall: `用「實際 ÷ 目標」計算達成率的統計表中，如果目標欄位還沒輸入（視為0），就會出現<b>#DIV/0!</b>錯誤，甚至可能連帶影響下方的合計欄一起出錯。只要用IFERROR包起來，就能把目標未輸入的資料列替換成空白或0之類指定的顯示內容。如果想顯示為空白，只要不在替代值欄位輸入任何內容，變成<b>""</b>就會顯示為空白。`,

  andor: {
    cat:'cond', label:'組合多個條件 (AND/OR)', level:'中級',
    scene:'適用情境：想同時判斷「部門為業務部」且「職稱為課長」等多個條件',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，如果
      <span contenteditable class="blank" data-k="range1">${v.range1}</span> 儲存格為
      「<span contenteditable class="blank" data-k="cond1" style="width:60px;">${v.cond1}</span>」，
      <select class="blank-select" data-k="logic" style="width:110px;">
        <option value="且(AND)" ${v.logic==='且(AND)'?'selected':''}>且(AND)</option>
        <option value="或(OR)" ${v.logic==='或(OR)'?'selected':''}>或(OR)</option>
      </select>
      <span contenteditable class="blank" data-k="range2">${v.range2}</span> 儲存格為
      「<span contenteditable class="blank" data-k="cond2" style="width:60px;">${v.cond2}</span>」，
      就顯示「<span contenteditable class="blank" data-k="yes" style="width:60px;">${v.yes}</span>」，
      否則顯示「<span contenteditable class="blank" data-k="no" style="width:60px;">${v.no}</span>」。`,
    values: {target:'D2', range1:'B2', cond1:'業務部', logic:'且(AND)', range2:'C2', cond2:'課長', yes:'對象', no:'對象外'},
    formula: (v) => v.logic.includes('OR') || v.logic.includes('或')
      ? `=IF(OR(${v.range1}="${v.cond1}",${v.range2}="${v.cond2}"),"${v.yes}","${v.no}")`
      : `=IF(AND(${v.range1}="${v.cond1}",${v.range2}="${v.cond2}"),"${v.yes}","${v.no}")`,
    explain: (v) => `<b>AND函數</b>會在所有條件都成立時傳回TRUE，<b>OR函數</b>則是只要有一個條件成立就傳回TRUE。搭配IF函數，就能依照多個條件切換顯示內容。系統會依照你選擇的「且／或」自動切換AND、OR。`,
    pitfall: `明明只想篩選出「業務部」且「課長」的人，卻不小心用OR（或）組成公式，就會導致即使不是業務部、只要職稱是課長就會被納入，符合條件的人數會比原本想篩選的範圍大幅增加。「且」和「或」搞混會讓符合條件的資料列大幅改變，請務必留意。如果想再增加條件，只要用逗號新增，例如AND(條件1,條件2,條件3)即可。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  isblankif: {
    cat:'cond', label:'依是否空白切換顯示 (ISBLANK+IF)', level:'初級',
    scene:'適用情境：未填寫的欄位維持空白，只在已填寫的資料列顯示計算結果',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，如果
      <span contenteditable class="blank" data-k="source">${v.source}</span> 儲存格是空白，就顯示
      「<span contenteditable class="blank" data-k="blankMsg" style="width:50px;">${v.blankMsg}</span>」；
      如果已經有輸入內容，就顯示
      「<span contenteditable class="blank" data-k="filledExpr" style="width:90px;">${v.filledExpr}</span>」
      的計算結果。`,
    values: {target:'C1', source:'A1', blankMsg:'', filledExpr:'A1*1.1'},
    formula: (v) => `=IF(ISBLANK(${v.source}),"${v.blankMsg}",${v.filledExpr})`,
    explain: (v) => `<b>ISBLANK函數</b>會判斷儲存格是否完全空白，傳回TRUE或FALSE。搭配IF函數，就能做出「空白時維持空白、已輸入時自動計算」的表格。`,
    pitfall: `如果某個儲存格的內容其實是另一個公式算出來的結果（實際上輸入了=""這樣的公式），外觀看起來雖然是空白，但用ISBLANK判斷會得到FALSE，導致本來想要「未輸入時維持空白」的判斷，卻跑進了「已輸入」的分支，顯示出不是預期中的計算結果。請注意，ISBLANK函數只會把「真正什麼都沒輸入的儲存格」判定為TRUE。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },

  /* ---------------- 查詢與參照 ---------------- */
  vlookup: {
    cat:'search', label:'從表格中查詢 (VLOOKUP)', level:'中級',
    scene:'適用情境：用員工編號查詢姓名、用商品代碼查詢單價',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，把
      <span contenteditable class="blank" data-k="key">${v.key}</span> 儲存格的值拿到
      <span contenteditable class="blank" data-k="range">${v.range}</span> 範圍的最左欄去查詢，並顯示該表格從左數來第
      <span contenteditable class="blank" data-k="col">${v.col}</span> 欄的值。`,
    values: {target:'D2', key:'C2', range:'A2:B100', col:'2'},

    scene:'適用情境：想計算年資、想用「幾年幾個月」表示在職期間',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，把
      <span contenteditable class="blank" data-k="from">${v.from}</span> 到
      <span contenteditable class="blank" data-k="to">${v.to}</span> 儲存格之間的期間，用
      「<select class="blank-select" data-k="unit" style="width:70px;">
        <option value="年" ${v.unit==='年'?'selected':''}>年</option>
        <option value="月" ${v.unit==='月'?'selected':''}>月</option>
        <option value="日" ${v.unit==='日'?'selected':''}>日</option>
      </select>」為單位計算出來。`,
    values: {target:'C1', from:'A1', to:'B1', unit:'年'},
    formula: (v) => {
      const unitMap = {'年':'Y', '月':'M', '日':'D'};

      return `=DATEDIF(${v.from},${v.to},"${u}")`;

    explain: (v) => `<b>DATEDIF函數</b>會計算兩個日期之間的期間。「Y」是滿年數，「M」是滿月數，「D」是天數，系統會依照你選擇的單位自動切換。`,
    pitfall: `事後檢視年資計算公式的同事，如果想用輸入自動完成功能搜尋這個函數名稱卻找不到候選項目，可能會誤以為「這個函數根本不存在」。因為這是<b>不會出現在Excel自動完成建議中</b>的函數，必須自己記住名稱手動輸入，是比較少見的函數，請特別注意拼字錯誤。`,

  networkdays: {

    pitfall: `計算橫跨連假的交期時，如果只用NETWORKDAYS以為已經扣除了假日，結果連假的天數也會被當成工作天計入，導致算出來的工作天數比實際情況多。如果想扣除國定假日，需要在第3個引數加入輸入了假日日期的儲存格範圍。不特別指定的話，<b>國定假日也會被當成工作天</b>計算。`,
    version: `Excel 2007以後即可使用（Excel 2003需要分析工具箱增益集）。`

  yearmonthday: {
    cat:'date', label:'從日期取出年・月・日 (YEAR/MONTH/DAY)', level:'初級',

    render: (v) => `我想從 <span contenteditable class="blank" data-k="source">${v.source}</span> 儲存格的日期中，只取出

        <option value="年" ${v.mode==='年'?'selected':''}>年</option>

    values: {target:'B1', source:'A1', mode:'年'},
    formula: (v) => v.mode.includes('月') ? `=MONTH(${v.source})` : v.mode.includes('日') ? `=DAY(${v.source})` : `=YEAR(${v.source})`,
    explain: (v) => `<b>YEAR函數</b>會從日期取出「年」，<b>MONTH函數</b>取出「月」，<b>DAY函數</b>取出「日」的數字。系統會依照你選擇的項目自動判斷要使用哪一個。`,
    pitfall: `想從日期資料只取出「月」用在月報標題上，但YEAR/MONTH/DAY的結果<b>單純是數字</b>（1月只會顯示「1」），不會變成「2026年1月」這種文字，用在標題上可能會顯得有點單調。取出的年、月、日<b>全部都是數字</b>，如果想顯示成文字，請搭配TEXT函數使用。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },

  /* ---------------- 數字進位與格式 ---------------- */
  round: {
    cat:'round', label:'四捨五入 (ROUND)', level:'初級',
    scene:'適用情境：想把計算營業稅後的零頭四捨五入',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，把

    values: {target:'B1', source:'A1', digit:'0'},
    formula: (v) => `=ROUND(${v.source},${v.digit})`,
    explain: (v) => `<b>ROUND函數</b>會依指定的位數四捨五入。位數指定「0」會變成整數，指定「-1」則會在十位數四捨五入。`,
    pitfall: `只把儲存格的顯示格式改成「小數點後1位」，看起來像是四捨五入了，但儲存格中的數值本身其實沒有改變，之後的加總計算還是會把沒顯示出來的零頭也算進去，可能和用計算機手算出來的總金額差了幾塊到幾十塊錢。ROUND函數會改變<b>數值本身</b>，因此會確實反映在後續的計算上。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  roundupdown: {
    cat:'round', label:'無條件進位・無條件捨去 (ROUNDUP/ROUNDDOWN)', level:'初級',

    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，把

      <span contenteditable class="blank" data-k="digit">${v.digit}</span> 位
      <select class="blank-select" data-k="mode" style="width:110px;">
        <option value="無條件進位" ${v.mode==='無條件進位'?'selected':''}>無條件進位</option>

    values: {target:'B1', source:'A1', digit:'0', mode:'無條件進位'},
    formula: (v) => v.mode.includes('進位') ? `=ROUNDUP(${v.source},${v.digit})` : `=ROUNDDOWN(${v.source},${v.digit})`,
    explain: (v) => `<b>ROUNDUP函數</b>一律無條件進位，<b>ROUNDDOWN函數</b>一律無條件捨去。和ROUND不同，就算小數點後是4以下也會進位、5以上也會捨去，這是它們的特色。`,
    pitfall: `公司內部規定報價金額不滿1元一律「無條件進位」，卻不小心用了ROUND函數（四捨五入），結果像0.4元這種零頭會被四捨五入捨去，開出的報價金額就會和公司規定不同。如果報價單或請款單有「不滿1元一律無條件進位」這類公司內部規定，就需要用ROUNDUP而不是ROUND（四捨五入），請務必分清楚兩者的用法。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  texttostr: {
    cat:'round', label:'改變顯示格式 (TEXT)', level:'中級',
    scene:'適用情境：想把數字顯示成「NT$1,000」或「2026年1月」這樣的外觀',
    render: (v) => `我想把 <span contenteditable class="blank" data-k="source">${v.source}</span> 儲存格的值，轉換成
      「<span contenteditable class="blank" data-k="format" style="width:110px;">${v.format}</span>」這種顯示格式的文字，
      顯示在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中。`,
    values: {target:'B1', source:'A1', format:'#,##0"元"'},
    formula: (v) => `=TEXT(${v.source},"${v.format}")`,
    explain: (v) => `<b>TEXT函數</b>會把數字或日期轉換成指定格式的「文字」。雖然效果類似改變儲存格的顯示格式，但TEXT函數的特色是可以用&和其他文字連接使用。`,
    pitfall: `用TEXT函數把金額欄轉換成「NT$1,000」這種外觀後，如果直接把這一欄拿到另一張統計表用SUM函數加總，即使外觀看起來是數字，實際上已經變成文字，加總結果可能會顯示為0元。用TEXT函數轉換後的結果會變成<b>文字</b>，之後無法再用於加總等進一步的計算，請記得這只是「純顯示用」的數值。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  },
  ceilingfloor: {
    cat:'round', label:'無條件進位・捨去至倍數 (CEILING/FLOOR)', level:'中級',
    scene:'適用情境：想把金額無條件進位到100元單位、想把時間無條件捨去到15分鐘單位',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，把
      <span contenteditable class="blank" data-k="source">${v.source}</span> 儲存格的數值，
      <select class="blank-select" data-k="mode" style="width:110px;">
        <option value="無條件進位" ${v.mode==='無條件進位'?'selected':''}>無條件進位</option>
        <option value="無條件捨去" ${v.mode==='無條件捨去'?'selected':''}>無條件捨去</option>
      </select>
      到 <span contenteditable class="blank" data-k="base">${v.base}</span> 的倍數。`,
    values: {target:'B1', source:'A1', base:'100', mode:'無條件進位'},
    formula: (v) => v.mode.includes('進位') ? `=CEILING(${v.source},${v.base})` : `=FLOOR(${v.source},${v.base})`,
    explain: (v) => `<b>CEILING函數</b>會無條件進位到指定基準值的倍數，<b>FLOOR函數</b>則會無條件捨去。和ROUNDUP／ROUNDDOWN不同，適合用在想湊成「10的倍數」「100的倍數」這類整數的情況。`,
    pitfall: `想把加班時間以15分鐘為單位無條件捨去來統計時，如果同時處理補休折抵等含有負數的數值，CEILING/FLOOR的運作方向會和正數時相反，導致捨入的方向和預期不同。基準值（倍數）使用負數時，運作方式會因數值正負而改變。只要是正數，就可以單純理解成「會捨入到指定基準值的倍數」。`,
    version: `Excel 2007以後即可使用（部分版本建議改用CEILING.MATH／FLOOR.MATH）。`
  },

    cat:'round', label:'只取出整數部分 (INT)', level:'初級',
    scene:'適用情境：想捨去小數點以下只留整數、只想取出除法的商',
    render: (v) => `我想在 <span contenteditable class="blank" data-k="target">${v.target}</span> 儲存格中，只取出
      <span contenteditable class="blank" data-k="source">${v.source}</span> 儲存格數值的整數部分。`,
    values: {target:'B1', source:'A1'},
    formula: (v) => `=INT(${v.source})`,
    explain: (v) => `<b>INT函數</b>會捨去小數點以下的部分，只傳回整數部分。雖然和ROUNDDOWN(儲存格,0)很像，但要注意負數的情況下結果會不一樣。`,
    pitfall: `補休折抵等情況下出現負數的加班時間（例如：-2.5小時）使用INT函數時，會捨入成<b>比它更小的整數</b>-3小時，和用ROUNDDOWN(-2.5,0)算出的-2小時不同。負數（例如：-2.5）的情況下，INT函數會傳回比它更小的整數（-3），和ROUNDDOWN(-2.5,0)的結果（-2）不同，處理負數時請特別留意。`,
    version: `Excel 2003以後的所有版本都可以使用。`
  }
};

/* ==========================================================
   狀態管理・畫面繪製邏輯
   ========================================================== */
const PAGE_SIZE = 4;

let currentCat = 'agg';
let currentPage = 0;

function catFnKeys(){
  return Object.keys(functions).filter(k => functions[k].cat === currentCat);
}

function totalPages(){
  return Math.max(1, Math.ceil(catFnKeys().length / PAGE_SIZE));
}

function renderCategoryRow(){
  const row = document.getElementById('categoryRow');
  row.innerHTML = '';
  categories.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'category-btn' + (c.key === currentCat ? ' active' : '');
    btn.textContent = c.label;
    btn.addEventListener('click', () => {
      currentCat = c.key;
      currentPage = 0;
      renderCategoryRow();
      renderFnRow();
      renderCards();
    });
    row.appendChild(btn);
  });
}

function renderFnRow(){
  const row = document.getElementById('fnRow');
  row.innerHTML = '';
  const fnKeys = catFnKeys();
  const start = currentPage * PAGE_SIZE;
  const visibleKeys = fnKeys.slice(start, start + PAGE_SIZE);
  fnKeys.forEach(key => {
    const f = functions[key];
    const btn = document.createElement('div');
    btn.className = 'fn-btn' + (visibleKeys.includes(key) ? ' active' : '');
    btn.innerHTML = `${f.label} <span class="lv">${f.level}</span>`;
    btn.addEventListener('click', () => {
      currentPage = Math.floor(fnKeys.indexOf(key) / PAGE_SIZE);
      renderFnRow();
      renderCards();
      highlightCard(key);
    });
    row.appendChild(btn);
  });
}

function buildCardHTML(key){
  const f = functions[key];
  return `
    <div class="card" data-cellref="${f.values.target}" id="card-${key}">
      <div class="scene">${f.scene}</div>
      <div class="sentence" id="sentence-${key}">${f.render(f.values)}</div>
      <div class="divider"></div>
      <div class="output-label">公式預覽</div>
      <div class="output-row">
        <div class="output-cell" id="formulaOut-${key}"></div>
        <button class="copy-btn" data-fn="${key}">複製</button>
      </div>
      <div class="copy-hint">複製這個公式，直接貼到Excel裡就可以使用了。</div>
      <div class="explain" id="explainArea-${key}"></div>
      <div class="pitfall" id="pitfallArea-${key}"></div>
      <div class="version-note"><span class="dot"></span><span>${f.version}</span></div>
    </div>
  `;
}

function renderCards(){
  const fnKeys = catFnKeys();
  const start = currentPage * PAGE_SIZE;
  const pageKeys = fnKeys.slice(start, start + PAGE_SIZE);

  const area = document.getElementById('cardsArea');
  area.innerHTML = pageKeys.map(buildCardHTML).join('');

  pageKeys.forEach(key => {
    document.querySelectorAll(`#card-${key} .blank, #card-${key} .blank-select`).forEach(el => el.setAttribute('data-fn', key));
    updateFormula(key);
  });

  bindBlanks();
  bindCopyButtons();
  renderPager();
}

function updateFormula(key){
  const f = functions[key];
  const out = document.getElementById(`formulaOut-${key}`);
  const exp = document.getElementById(`explainArea-${key}`);
  const pit = document.getElementById(`pitfallArea-${key}`);
  if (out) out.textContent = f.formula(f.values);
  if (exp) exp.innerHTML = f.explain(f.values);
  if (pit) pit.innerHTML = f.pitfall;
}

function bindBlanks(){
  document.querySelectorAll('#cardsArea .blank').forEach(el => {
    el.addEventListener('input', () => {
      const key = el.getAttribute('data-fn');
      const k = el.getAttribute('data-k');
      functions[key].values[k] = el.textContent.trim();
      updateFormula(key);
    });
  });
  document.querySelectorAll('#cardsArea .blank-select').forEach(el => {
    el.addEventListener('change', () => {
      const key = el.getAttribute('data-fn');
      const k = el.getAttribute('data-k');
      functions[key].values[k] = el.value;
      updateFormula(key);
    });
  });
}

function bindCopyButtons(){
  document.querySelectorAll('#cardsArea .copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-fn');
      const text = document.getElementById(`formulaOut-${key}`).textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '已複製';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 1500);

        if (typeof gtag === 'function') {
          gtag('event', 'copy_formula', { function_name: key });
        }
      });
    });
  });
}

function renderPager(){
  const area = document.getElementById('pagerArea');
  const pages = totalPages();
  area.innerHTML = `
    <button class="pager-btn" id="prevPageBtn" ${currentPage <= 0 ? 'disabled' : ''}>← 上一頁</button>
    <span class="pager-info">${currentPage + 1} / ${pages} 頁</span>
    <button class="pager-btn" id="nextPageBtn" ${currentPage >= pages - 1 ? 'disabled' : ''}>下一頁 →</button>
  `;
  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      renderFnRow();
      renderCards();
    }
  });
  document.getElementById('nextPageBtn').addEventListener('click', () => {
    if (currentPage < totalPages() - 1) {
      currentPage++;
      renderFnRow();
      renderCards();
    }
  });
}

function highlightCard(key){
  const el = document.getElementById(`card-${key}`);
  if (!el) return;
  if (typeof el.scrollIntoView === 'function') {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1500);
}

renderCategoryRow();
renderFnRow();
renderCards();
</script>
