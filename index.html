<script>
/* ==========================================================
   データ定義：カテゴリ → 関数 の2階層構造
   ========================================================== */
const categories = [
  { key:'agg',  label:'集計・計算' },
  { key:'cond', label:'条件分岐' },
  { key:'search', label:'検索・参照' },
  { key:'text', label:'文字列操作' },
  { key:'date', label:'日付・時刻' },
  { key:'round', label:'端数処理・書式' }
];

const functions = {

  /* ---------------- 集計・計算 ---------------- */
  sum: {
    cat:'agg', label:'合計 (SUM)', level:'初級',
    scene:'こんな時に：経費精算書の各費目を合計する、日別売上の月間集計を出す',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="from">${v.from}</span> セルから
      <span contenteditable class="blank" data-k="to">${v.to}</span> セルまでの数字を
      全部足した結果を出したい。`,
    values: {target:'A1', from:'B1', to:'D1'},
    formula: (v) => `=SUM(${v.from}:${v.to})`,
    explain: (v) => `<b>SUM関数</b>は、指定した範囲のセルに入っている数値をすべて足し算します。<br>
      <b>SUM(${v.from}:${v.to})</b> は「${v.from}セルから${v.to}セルまでの合計」という意味です。結果は ${v.target} セルに入力してください。`,
    pitfall: `経費明細表の一番下に新しい費目の行を1行追加したのに、合計欄の数式が<b>SUM(B1:B10)</b>のように範囲が固定されたままだと、追加した行の金額は合計に反映されません。範囲のすぐ内側（最終行の上）に行を挿入すれば数式は自動で追随しますが、範囲の外側（最終行の下）に行を足した場合は、合計欄の数式を手動で伸ばす必要があります。離れたセルも合計したい場合は<b>SUM(B1,D1,F1)</b>のようにカンマ区切りでも指定できます。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  average: {
    cat:'agg', label:'平均 (AVERAGE)', level:'初級',
    scene:'こんな時に：研修理解度テストの平均点、部署ごとの平均残業時間を出したい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="from">${v.from}</span> セルから
      <span contenteditable class="blank" data-k="to">${v.to}</span> セルまでの数字の
      平均を出したい。`,
    values: {target:'E1', from:'B1', to:'D1'},
    formula: (v) => `=AVERAGE(${v.from}:${v.to})`,
    explain: (v) => `<b>AVERAGE関数</b>は、指定した範囲の数値の平均値（合計 ÷ 個数）を計算します。`,
    pitfall: `受験者10人中1人が欠席だった研修テストで、欠席者の点数欄に「0点」と入力してしまうと、AVERAGE関数はその0も人数に含めて計算するため、実際は9人分のはずの平均点が10人分として計算され、本来より大きく低い平均点が出てしまいます。空白セルは平均の計算から自動的に除外されるので、欠席者の欄は空白のままにしておく必要があります。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  count: {
    cat:'agg', label:'個数 (COUNT/COUNTA)', level:'初級',
    scene:'こんな時に：経費精算書の提出済み件数、押印済みの申請書の件数を数えたい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="from">${v.from}</span> セルから
      <span contenteditable class="blank" data-k="to">${v.to}</span> セルまでの中で、
      <select class="blank-select" data-k="mode" style="width:110px;">
        <option value="数字が入っている" ${v.mode==='数字が入っている'?'selected':''}>数字が入っている</option>
        <option value="文字も含めて全部" ${v.mode==='文字も含めて全部'?'selected':''}>文字も含めて全部</option>
      </select>
      セルの数を出したい。`,
    values: {target:'F1', from:'B1', to:'B10', mode:'数字が入っている'},
    formula: (v) => v.mode.includes('数字') ? `=COUNT(${v.from}:${v.to})` : `=COUNTA(${v.from}:${v.to})`,
    explain: (v) => `<b>COUNT関数</b>は数値が入っているセルだけを数え、<b>COUNTA関数</b>は文字も含めて「何か入力されているセル」を数えます。空欄の入力内容に応じてどちらかを自動で選んでいます。`,
    pitfall: `提出済みの欄に「済」のような文字だけを入力した申請書一覧でCOUNT関数を使うと、文字は数値として扱われないため件数が0件と表示されてしまいます。文字が入っているセルも数えたい場合はCOUNTA関数を使う必要があります。数字だけ数えるならCOUNT／文字も含めるならCOUNTAと覚えてください。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  sumif: {
    cat:'agg', label:'条件付き合計 (SUMIF)', level:'中級',
    scene:'こんな時に：部署ごとの経費合計、担当者ごとの売上合計',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="condRange">${v.condRange}</span> の中で
      「<span contenteditable class="blank" data-k="cond" style="width:70px;">${v.cond}</span>」に一致する行だけを対象に、
      <span contenteditable class="blank" data-k="sumRange">${v.sumRange}</span> の数字を合計したい。`,
    values: {target:'E1', condRange:'B1:B10', cond:'営業部', sumRange:'C1:C10'},
    formula: (v) => `=SUMIF(${v.condRange},"${v.cond}",${v.sumRange})`,
    explain: (v) => `<b>SUMIF関数</b>は、条件に一致する行だけを対象に合計を出します。「条件を見る列（${v.condRange}）」と「合計する列（${v.sumRange}）」は行数を揃える必要があります。`,
    pitfall: `部署名の列がB2:B10なのに、合計対象の金額の列を1行ずれたC1:C9のように指定してしまうと、部署名と金額の対応関係が1行分ずれた状態で集計され、実際の部署別合計とは違う金額が出てしまいます。表の先頭に見出し行があるかどうかで開始行がズレやすいので、条件の範囲と合計する範囲は同じ行数・同じ開始行になっているか必ず確認してください。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  subtotal: {
    cat:'agg', label:'フィルター対応合計 (SUBTOTAL)', level:'上級',
    scene:'こんな時に：フィルターをかけた後の合計を正しく出したい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      フィルターで絞り込んだ状態でも正しく
      <span contenteditable class="blank" data-k="from">${v.from}</span> セルから
      <span contenteditable class="blank" data-k="to">${v.to}</span> セルの合計を出したい。`,
    values: {target:'D1', from:'B2', to:'B20'},
    formula: (v) => `=SUBTOTAL(109,${v.from}:${v.to})`,
    explain: (v) => `<b>SUBTOTAL関数</b>は、フィルターで非表示になった行を計算から除外できる集計関数です。「109」は合計を意味する集計方法番号です。`,
    pitfall: `オートフィルターで「営業部」だけに絞り込んで画面に見えている行だけを目で追って確認しても、合計欄の数式が普通の<b>SUM</b>のままだと、非表示になった他部署の行の金額まで合計に含まれたままになり、見た目の行だけを見ていると気づかないまま誤った金額を報告してしまうことがあります。フィルターをよく使う表には最初からSUBTOTALを使っておくのがおすすめです。`,
    version: `Excel 2003以降で使用できます。`
  },
  countifs: {
    cat:'agg', label:'複数条件でカウント (COUNTIFS)', level:'上級',
    scene:'こんな時に：「営業部」かつ「正社員」の人数など、2つ以上の条件で数えたい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="range1">${v.range1}</span> の中で「<span contenteditable class="blank" data-k="cond1" style="width:60px;">${v.cond1}</span>」、
      かつ <span contenteditable class="blank" data-k="range2">${v.range2}</span> の中で「<span contenteditable class="blank" data-k="cond2" style="width:60px;">${v.cond2}</span>」
      を両方満たす行の数を数えたい。`,
    values: {target:'F1', range1:'B2:B20', cond1:'営業部', range2:'C2:C20', cond2:'正社員'},

  /* ---------------- 条件分岐 ---------------- */
  if: {
    cat:'cond', label:'条件で表示を変える (IF)', level:'初級',
    scene:'こんな時に：合格/不合格の判定、金額によって処理を分けたい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルの数字が
      <span contenteditable class="blank" data-k="threshold">${v.threshold}</span>
      <select class="blank-select" data-k="cmp" style="width:100px;">
        <option value="より大きい" ${v.cmp==='より大きい'?'selected':''}>より大きい</option>
        <option value="以上" ${v.cmp==='以上'?'selected':''}>以上</option>
        <option value="より小さい" ${v.cmp==='より小さい'?'selected':''}>より小さい</option>
        <option value="以下" ${v.cmp==='以下'?'selected':''}>以下</option>
        <option value="と等しい" ${v.cmp==='と等しい'?'selected':''}>と等しい</option>
      </select>なら
      「<span contenteditable class="blank" data-k="yes" style="width:70px;">${v.yes}</span>」、
      そうでなければ
      「<span contenteditable class="blank" data-k="no" style="width:70px;">${v.no}</span>」
      と表示したい。`,
    values: {target:'C1', threshold:'80', cmp:'より大きい', yes:'合格', no:'不合格'},
    formula: (v) => {
      const opMap = {'より大きい':'>','以上':'>=','より小さい':'<','以下':'<=','と等しい':'='};
      const op = opMap[v.cmp] || '>';
      return `=IF(${v.target}${op}${v.threshold},"${v.yes}","${v.no}")`;
    },
    explain: (v) => `<b>IF関数</b>は「条件が正しければA、そうでなければB」を表示します。比較の言葉（より大きい／以上／より小さい／以下／と等しい）に応じて記号（&gt; &gt;= &lt; &lt;= =）が自動で変わります。`,
    pitfall: `合格ラインをちょうど80点に決めたのに、「以上」のつもりで「より大きい」（80点は含まない）を選んでしまうと、80点ちょうどの人だけが不合格判定になってしまいます。「以上」と「より大きい」を混同すると、境界の数字（この例だと80ちょうど）の扱いが変わってしまうので、基準の数字を含めるかどうかを事前に確認してください。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  ifs: {

    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルの数字が

      <span contenteditable class="blank" data-k="t2">${v.t2}</span>以上なら「<span contenteditable class="blank" data-k="r2" style="width:50px;">${v.r2}</span>」、

    pitfall: `IF関数を何段にも入れ子にした数式が長くなって読みにくくなっている場合、IFSに置き換えるとスッキリします。ただし取引先などに渡すファイルで使うと、相手が<b>Excel 2016以前</b>で開いた際に関数名が認識されず<b>#NAME?</b>エラーになってしまうことがあるので、渡す相手のExcelバージョンには注意してください。`,

  /* ---------------- 端数処理・書式 ---------------- */

    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  texttostr: {
    cat:'round', label:'表示形式を変える (TEXT)', level:'中級',

    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、

    pitfall: `TEXT関数で「¥1,000」のような見た目に変換した金額の列を、そのまま別の集計表でSUM関数に読み込ませようとすると、見た目は数字でも実際は文字列になっているため合計が0円と表示されてしまうことがあります。TEXT関数で変換した結果は<b>文字列</b>になるため、それ以上の計算（合計など）には使えなくなります。あくまで「表示専用」の値だと覚えておいてください。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  },
  ceilingfloor: {
    cat:'round', label:'倍数に切り上げ・切り下げる (CEILING/FLOOR)', level:'中級',
    scene:'こんな時に：金額を100円単位で切り上げたい、時間を15分単位で切り捨てたい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="source">${v.source}</span> セルの数値を、
      <span contenteditable class="blank" data-k="base">${v.base}</span> の倍数になるように
      <select class="blank-select" data-k="mode" style="width:80px;">
        <option value="切り上げ" ${v.mode==='切り上げ'?'selected':''}>切り上げ</option>
        <option value="切り捨て" ${v.mode==='切り捨て'?'selected':''}>切り捨て</option>
      </select>したい。`,
    values: {target:'B1', source:'A1', base:'100', mode:'切り上げ'},
    formula: (v) => v.mode.includes('上げ') ? `=CEILING(${v.source},${v.base})` : `=FLOOR(${v.source},${v.base})`,
    explain: (v) => `<b>CEILING関数</b>は指定した基準値の倍数になるように切り上げ、<b>FLOOR関数</b>は切り捨てます。ROUNDUP／ROUNDDOWNと違い、「10の倍数」「100の倍数」のようなキリのいい数字に揃えたいときに便利です。`,
    pitfall: `残業時間を15分単位で切り捨てて集計しようとする際、代休精算などでマイナスの数値を扱うと、CEILING/FLOORの挙動がプラスの数値のときと逆になり、想定と違う方向に丸められてしまうことがあります。基準値（倍数）にマイナスの数値を使う場合など、数値の正負によって挙動が変わることがあります。プラスの数値であれば、指定した基準値の倍数に丸められると覚えておけば問題ありません。`,
    version: `Excel 2007以降で使用できます（バージョンによってはCEILING.MATH／FLOOR.MATHへの置き換えが推奨されています）。`
  },
  int: {
    cat:'round', label:'整数部分だけ取り出す (INT)', level:'初級',
    scene:'こんな時に：小数点以下を切り捨てて整数だけにしたい、割り算の商だけを求めたい',
    render: (v) => `<span contenteditable class="blank" data-k="target">${v.target}</span> セルに、
      <span contenteditable class="blank" data-k="source">${v.source}</span> セルの数値の
      整数部分だけを取り出したい。`,

    formula: (v) => `=INT(${v.source})`,
    explain: (v) => `<b>INT関数</b>は、数値の小数点以下を切り捨てて整数部分だけを返します。ROUNDDOWN(セル,0)と似ていますが、マイナスの数値の場合は結果が異なる点に注意してください。`,
    pitfall: `代休精算などでマイナス表記になる残業時間（例：-2.5時間）にINT関数を使うと、-3時間という「より小さい」整数に切り捨てられ、ROUNDDOWN(-2.5,0)で計算した-2時間とは違う結果になってしまいます。マイナスの数値（例：-2.5）の場合、INT関数は<b>より小さい整数</b>（-3）を返します。ROUNDDOWN(-2.5,0)の結果（-2）とは異なるので、マイナスの数値を扱う場合は注意してください。`,
    version: `Excel 2003以降、すべてのバージョンで使用できます。`
  }
};

/* ==========================================================
   状態管理・描画ロジック
   ========================================================== */
const PAGE_SIZE = 4;

let currentCat = 'agg';
let currentPage = 0;

function catFnKeys(){
  return Object.keys(functions).filter(k => functions[k].cat === currentCat);
}

function totalPages(){
  return Math.max(1, Math.ceil(catFnKeys().length / PAGE_SIZE));
}

function renderCategoryRow(){
  const row = document.getElementById('categoryRow');
  row.innerHTML = '';
  categories.forEach(c => {
    const btn = document.createElement('div');
    btn.className = 'category-btn' + (c.key === currentCat ? ' active' : '');
    btn.textContent = c.label;
    btn.addEventListener('click', () => {
      currentCat = c.key;
      currentPage = 0;
      renderCategoryRow();
      renderFnRow();
      renderCards();
    });
    row.appendChild(btn);
  });
}

function renderFnRow(){
  const row = document.getElementById('fnRow');
  row.innerHTML = '';
  const fnKeys = catFnKeys();
  const start = currentPage * PAGE_SIZE;
  const visibleKeys = fnKeys.slice(start, start + PAGE_SIZE);
  fnKeys.forEach(key => {
    const f = functions[key];
    const btn = document.createElement('div');
    btn.className = 'fn-btn' + (visibleKeys.includes(key) ? ' active' : '');
    btn.innerHTML = `${f.label} <span class="lv">${f.level}</span>`;
    btn.addEventListener('click', () => {
      currentPage = Math.floor(fnKeys.indexOf(key) / PAGE_SIZE);
      renderFnRow();
      renderCards();
      highlightCard(key);
    });
    row.appendChild(btn);
  });
}

function buildCardHTML(key){
  const f = functions[key];
  return `
    <div class="card" data-cellref="${f.values.target}" id="card-${key}">
      <div class="scene">${f.scene}</div>
      <div class="sentence" id="sentence-${key}">${f.render(f.values)}</div>
      <div class="divider"></div>
      <div class="output-label">数式プレビュー</div>
      <div class="output-row">
        <div class="output-cell" id="formulaOut-${key}"></div>
        <button class="copy-btn" data-fn="${key}">コピー</button>
      </div>
      <div class="copy-hint">この式をコピーしてExcelに貼り付けるだけでOKです。</div>
      <div class="explain" id="explainArea-${key}"></div>
      <div class="pitfall" id="pitfallArea-${key}"></div>
      <div class="version-note"><span class="dot"></span><span>${f.version}</span></div>
    </div>
  `;
}

function renderCards(){
  const fnKeys = catFnKeys();
  const start = currentPage * PAGE_SIZE;
  const pageKeys = fnKeys.slice(start, start + PAGE_SIZE);

  const area = document.getElementById('cardsArea');
  area.innerHTML = pageKeys.map(buildCardHTML).join('');

  pageKeys.forEach(key => {
    document.querySelectorAll(`#card-${key} .blank, #card-${key} .blank-select`).forEach(el => el.setAttribute('data-fn', key));
    updateFormula(key);
  });

  bindBlanks();
  bindCopyButtons();
  renderPager();
}

function updateFormula(key){
  const f = functions[key];
  const out = document.getElementById(`formulaOut-${key}`);
  const exp = document.getElementById(`explainArea-${key}`);
  const pit = document.getElementById(`pitfallArea-${key}`);
  if (out) out.textContent = f.formula(f.values);
  if (exp) exp.innerHTML = f.explain(f.values);
  if (pit) pit.innerHTML = f.pitfall;
}

function bindBlanks(){
  document.querySelectorAll('#cardsArea .blank').forEach(el => {
    el.addEventListener('input', () => {
      const key = el.getAttribute('data-fn');
      const k = el.getAttribute('data-k');
      functions[key].values[k] = el.textContent.trim();
      updateFormula(key);
    });
  });
  document.querySelectorAll('#cardsArea .blank-select').forEach(el => {
    el.addEventListener('change', () => {
      const key = el.getAttribute('data-fn');
      const k = el.getAttribute('data-k');
      functions[key].values[k] = el.value;
      updateFormula(key);
    });
  });
}

function bindCopyButtons(){
  document.querySelectorAll('#cardsArea .copy-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const key = btn.getAttribute('data-fn');
      const text = document.getElementById(`formulaOut-${key}`).textContent;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'コピーしました';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 1500);

        if (typeof gtag === 'function') {
          gtag('event', 'copy_formula', { function_name: key });
        }
      });
    });
  });
}

function renderPager(){
  const area = document.getElementById('pagerArea');
  const pages = totalPages();
  area.innerHTML = `
    <button class="pager-btn" id="prevPageBtn" ${currentPage <= 0 ? 'disabled' : ''}>← 前へ</button>
    <span class="pager-info">${currentPage + 1} / ${pages} ページ</span>
    <button class="pager-btn" id="nextPageBtn" ${currentPage >= pages - 1 ? 'disabled' : ''}>次へ →</button>
  `;
  document.getElementById('prevPageBtn').addEventListener('click', () => {
    if (currentPage > 0) {
      currentPage--;
      renderFnRow();
      renderCards();
    }
  });
  document.getElementById('nextPageBtn').addEventListener('click', () => {
    if (currentPage < totalPages() - 1) {
      currentPage++;
      renderFnRow();
      renderCards();
    }
  });
}

function highlightCard(key){
  const el = document.getElementById(`card-${key}`);
  if (!el) return;
  if (typeof el.scrollIntoView === 'function') {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1500);
}

renderCategoryRow();
renderFnRow();
renderCards();
</script>
